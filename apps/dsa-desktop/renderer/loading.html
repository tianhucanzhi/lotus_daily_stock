<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>莲花智投</title>
    <style>
      :root {
        color-scheme: dark light;
        --bg: #f4f7fb;
        --bg-secondary: #e8edf5;
        --panel: rgba(255, 255, 255, 0.88);
        --text: #172033;
        --muted: #5e6a7e;
        --accent: #0ea5c6;
        --track: rgba(14, 165, 198, 0.14);
        --danger-bg: rgba(225, 29, 72, 0.08);
        --danger-border: rgba(225, 29, 72, 0.32);
        --danger-text: #b91c3c;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #08080c;
          --bg-secondary: #131722;
          --panel: rgba(16, 18, 28, 0.9);
          --text: #e2e8f0;
          --muted: #94a3b8;
          --accent: #38bdf8;
          --track: rgba(56, 189, 248, 0.14);
          --danger-bg: rgba(239, 68, 68, 0.08);
          --danger-border: rgba(239, 68, 68, 0.4);
          --danger-text: #fecaca;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        background: radial-gradient(circle at top left, var(--bg-secondary), var(--bg) 55%);
        color: var(--text);
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .panel {
        width: min(640px, 90vw);
        background: var(--panel);
        border: 1px solid color-mix(in srgb, var(--accent) 26%, transparent);
        border-radius: 16px;
        padding: 32px 36px;
        box-shadow: 0 30px 80px rgba(15, 23, 42, 0.18);
        backdrop-filter: blur(18px);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-bottom: 18px;
      }

      .brand img {
        width: 52px;
        height: 52px;
        object-fit: contain;
        flex-shrink: 0;
      }

      .brand-copy {
        min-width: 0;
      }

      .title {
        font-size: 24px;
        margin: 0 0 6px;
        letter-spacing: 0.4px;
      }

      .subtitle {
        margin: 0;
        color: var(--muted);
        font-size: 14px;
      }

      .status {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        font-size: 14px;
        color: var(--muted);
      }

      .status-left {
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 0;
      }

      .percent {
        font-variant-numeric: tabular-nums;
        font-size: 13px;
        color: var(--accent);
        flex-shrink: 0;
      }

      .progress {
        margin-top: 16px;
        width: 100%;
        height: 8px;
        border-radius: 999px;
        background: var(--track);
        overflow: hidden;
      }

      .progress-bar {
        height: 100%;
        width: 0%;
        border-radius: inherit;
        background: linear-gradient(90deg, #0ea5c6, #38bdf8, #818cf8);
        box-shadow: 0 0 16px rgba(56, 189, 248, 0.45);
        transition: width 0.25s ease-out;
        position: relative;
      }

      .progress-bar::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          120deg,
          transparent 0%,
          rgba(255, 255, 255, 0.35) 45%,
          transparent 70%
        );
        transform: translateX(-100%);
        animation: shimmer 1.4s ease-in-out infinite;
      }

      .error {
        margin-top: 16px;
        padding: 12px 14px;
        border-radius: 10px;
        background: var(--danger-bg);
        border: 1px solid var(--danger-border);
        color: var(--danger-text);
        font-size: 12px;
        line-height: 1.5;
        display: none;
      }

      .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 12px rgba(56, 189, 248, 0.8);
        animation: pulse 1.5s ease-in-out infinite;
        flex-shrink: 0;
      }

      @keyframes pulse {
        0%, 100% {
          transform: scale(1);
          opacity: 1;
        }
        50% {
          transform: scale(1.4);
          opacity: 0.6;
        }
      }

      @keyframes shimmer {
        100% {
          transform: translateX(100%);
        }
      }
    </style>
  </head>
  <body>
    <div class="panel">
      <div class="brand">
        <img src="./lotus-mark.png" alt="莲花智投" />
        <div class="brand-copy">
          <h1 class="title">莲花智投</h1>
          <p class="subtitle">AI 选股决策盯盘</p>
        </div>
      </div>
      <div class="status">
        <div class="status-left">
          <span class="dot"></span>
          <span id="statusText">正在启动本地分析服务并加载界面...</span>
        </div>
        <span class="percent" id="percentText">0%</span>
      </div>
      <div class="progress" aria-hidden="true">
        <div class="progress-bar" id="progressBar"></div>
      </div>
      <div class="error" id="errorBox"></div>
    </div>
    <script>
      (function () {
        const params = new URLSearchParams(window.location.search);
        const error = params.get('error');
        const box = document.getElementById('errorBox');
        const bar = document.getElementById('progressBar');
        const percentText = document.getElementById('percentText');
        const statusText = document.getElementById('statusText');

        if (error) {
          if (box) {
            box.textContent = `启动失败：${decodeURIComponent(error)}`;
            box.style.display = 'block';
          }
          if (statusText) statusText.textContent = '启动失败';
          if (bar) bar.style.width = '100%';
          if (percentText) percentText.textContent = '失败';
          return;
        }

        let progress = 0;
        const stages = [
          { at: 18, text: '正在初始化运行环境...' },
          { at: 42, text: '正在启动本地分析服务...' },
          { at: 68, text: '正在加载工作台界面...' },
          { at: 88, text: '即将完成，请稍候...' },
        ];

        const timer = setInterval(function () {
          if (progress >= 92) {
            clearInterval(timer);
            return;
          }

          const remaining = 92 - progress;
          const step = Math.max(0.35, remaining * 0.045 + Math.random() * 1.8);
          progress = Math.min(92, progress + step);

          if (bar) bar.style.width = progress.toFixed(1) + '%';
          if (percentText) percentText.textContent = Math.floor(progress) + '%';

          for (let i = stages.length - 1; i >= 0; i -= 1) {
            if (progress >= stages[i].at) {
              if (statusText) statusText.textContent = stages[i].text;
              break;
            }
          }
        }, 220);
      })();
    </script>
  </body>
</html>
